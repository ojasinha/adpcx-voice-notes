[project]
name = "adpcx-assignment"
version = "0.1.0"
description = "Voice-driven note taking and task management with self-hosted STT."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["app"]
